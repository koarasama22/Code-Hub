<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP3 カバー画像埋め込みツール</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a20;
      --surface2: #24242c;
      --border: #33333d;
      --text: #f0f0f5;
      --text-muted: #9898a6;
      --accent: #7c5cff;
      --accent-hover: #9478ff;
      --success: #2dd4a8;
      --danger: #ff5c7a;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 92, 255, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(45, 212, 168, 0.08), transparent);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 30%, #b8a8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(45, 212, 168, 0.12);
      color: var(--success);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-top: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(124, 92, 255, 0.06);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-icon {
      font-size: 2rem;
      margin-bottom: 8px;
      opacity: 0.7;
    }

    .drop-text {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .drop-text strong {
      color: var(--accent);
    }

    .file-info {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--success);
      display: none;
    }

    .preview-area {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .cover-preview {
      width: 160px;
      height: 160px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      object-fit: cover;
      display: none;
    }

    .cover-placeholder {
      width: 160px;
      height: 160px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 12px;
    }

    .meta-fields {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
      font-family: inherit;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      flex: 1;
      min-width: 180px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #2e2e38;
    }

    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .status.info {
      background: rgba(124, 92, 255, 0.12);
      color: #c4b5ff;
      display: block;
    }

    .status.success {
      background: rgba(45, 212, 168, 0.12);
      color: var(--success);
      display: block;
    }

    .status.error {
      background: rgba(255, 92, 122, 0.12);
      color: var(--danger);
      display: block;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 520px) {
      .preview-area {
        flex-direction: column;
        align-items: center;
      }
      .meta-fields {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>MP3 カバー画像埋め込み</h1>
      <p>MP3ファイルにアルバムアート（カバー画像）を埋め込みます</p>
      <div class="badge">🔒 完全ローカル処理・ファイルは外部送信されません</div>
    </header>

    <!-- MP3選択 -->
    <div class="card">
      <div class="card-title">1. MP3ファイルを選択</div>
      <div class="drop-zone" id="mp3Zone">
        <input type="file" id="mp3Input" accept="audio/mpeg,.mp3">
        <div class="drop-icon">🎵</div>
        <div class="drop-text">クリックまたはドラッグ＆ドロップ<br><strong>MP3ファイル</strong></div>
        <div class="file-info" id="mp3Info"></div>
      </div>
    </div>

    <!-- 画像選択 -->
    <div class="card">
      <div class="card-title">2. カバー画像を選択</div>
      <div class="drop-zone" id="imgZone">
        <input type="file" id="imgInput" accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif">
        <div class="drop-icon">🖼️</div>
        <div class="drop-text">クリックまたはドラッグ＆ドロップ<br><strong>JPG / PNG / WebP</strong></div>
        <div class="file-info" id="imgInfo"></div>
      </div>
    </div>

    <!-- プレビュー & メタデータ -->
    <div class="card">
      <div class="card-title">3. プレビュー &amp; メタデータ（任意）</div>
      <div class="preview-area">
        <div>
          <img id="coverPreview" class="cover-preview" alt="カバープレビュー">
          <div id="coverPlaceholder" class="cover-placeholder">画像を選択すると<br>ここに表示されます</div>
        </div>
        <div class="meta-fields">
          <div>
            <label for="titleInput">曲名 (TIT2)</label>
            <input type="text" id="titleInput" placeholder="（任意）">
          </div>
          <div>
            <label for="artistInput">アーティスト (TPE1)</label>
            <input type="text" id="artistInput" placeholder="（任意）">
          </div>
          <div>
            <label for="albumInput">アルバム (TALB)</label>
            <input type="text" id="albumInput" placeholder="（任意）">
          </div>
        </div>
      </div>
    </div>

    <!-- 実行 -->
    <div class="card">
      <div class="card-title">4. 埋め込み &amp; ダウンロード</div>
      <div class="actions">
        <button class="btn-primary" id="processBtn" disabled>カバー画像を埋め込んでダウンロード</button>
        <button class="btn-secondary" id="resetBtn">リセット</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <footer>
      処理はすべてブラウザ内で完結します。<br>
      使用ライブラリ: <a href="https://github.com/egoroof/browser-id3-writer" target="_blank" rel="noopener">browser-id3-writer</a>
    </footer>
  </div>

  <script type="module">
    import { ID3Writer } from 'https://cdn.jsdelivr.net/npm/browser-id3-writer@6.4.0/+esm';

    const mp3Input = document.getElementById('mp3Input');
    const imgInput = document.getElementById('imgInput');
    const mp3Zone = document.getElementById('mp3Zone');
    const imgZone = document.getElementById('imgZone');
    const mp3Info = document.getElementById('mp3Info');
    const imgInfo = document.getElementById('imgInfo');
    const coverPreview = document.getElementById('coverPreview');
    const coverPlaceholder = document.getElementById('coverPlaceholder');
    const titleInput = document.getElementById('titleInput');
    const artistInput = document.getElementById('artistInput');
    const albumInput = document.getElementById('albumInput');
    const processBtn = document.getElementById('processBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');

    let mp3File = null;
    let mp3Buffer = null;
    let coverBuffer = null;
    let coverMime = null;

    function setStatus(type, msg) {
      statusEl.className = 'status ' + type;
      statusEl.textContent = msg;
    }

    function clearStatus() {
      statusEl.className = 'status';
      statusEl.textContent = '';
    }

    function updateButton() {
      processBtn.disabled = !(mp3Buffer && coverBuffer);
    }

    function setupDropZone(zone, input, onFile) {
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('dragover');
      });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
          input.files = e.dataTransfer.files;
          onFile(e.dataTransfer.files[0]);
        }
      });
      input.addEventListener('change', () => {
        if (input.files.length) onFile(input.files[0]);
      });
    }

    async function handleMp3(file) {
      if (!file || !file.name.toLowerCase().endsWith('.mp3')) {
        setStatus('error', 'MP3ファイルを選択してください');
        return;
      }
      mp3File = file;
      mp3Info.style.display = 'block';
      mp3Info.textContent = `✓ ${file.name}（${(file.size / 1024 / 1024).toFixed(2)} MB）`;
      clearStatus();

      try {
        mp3Buffer = await file.arrayBuffer();
        updateButton();
      } catch (err) {
        setStatus('error', 'MP3の読み込みに失敗しました: ' + err.message);
        mp3Buffer = null;
        updateButton();
      }
    }

    async function handleImage(file) {
      if (!file || !file.type.startsWith('image/')) {
        setStatus('error', '画像ファイルを選択してください');
        return;
      }
      imgInfo.style.display = 'block';
      imgInfo.textContent = `✓ ${file.name}（${(file.size / 1024).toFixed(0)} KB）`;
      clearStatus();

      const url = URL.createObjectURL(file);
      coverPreview.src = url;
      coverPreview.style.display = 'block';
      coverPlaceholder.style.display = 'none';

      try {
        coverBuffer = await file.arrayBuffer();
        coverMime = file.type;
        updateButton();
      } catch (err) {
        setStatus('error', '画像の読み込みに失敗しました: ' + err.message);
        coverBuffer = null;
        updateButton();
      }
    }

    setupDropZone(mp3Zone, mp3Input, handleMp3);
    setupDropZone(imgZone, imgInput, handleImage);

    processBtn.addEventListener('click', async () => {
      if (!mp3Buffer || !coverBuffer) return;

      processBtn.disabled = true;
      setStatus('info', '処理中… しばらくお待ちください');

      try {
        const writer = new ID3Writer(mp3Buffer);

        // カバー画像（type 3 = Cover front）
        writer.setFrame('APIC', {
          type: 3,
          data: coverBuffer,
          description: 'Cover',
          useUnicodeEncoding: false
        });

        // 任意のメタデータ
        const title = titleInput.value.trim();
        const artist = artistInput.value.trim();
        const album = albumInput.value.trim();

        if (title) writer.setFrame('TIT2', title);
        if (artist) writer.setFrame('TPE1', [artist]);
        if (album) writer.setFrame('TALB', album);

        writer.addTag();

        const blob = writer.getBlob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        const baseName = mp3File.name.replace(/\.mp3$/i, '');
        a.href = url;
        a.download = `${baseName}_cover.mp3`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        setStatus('success', '完了！ カバー画像を埋め込んだMP3をダウンロードしました。');
      } catch (err) {
        console.error(err);
        setStatus('error', '埋め込みに失敗しました: ' + (err.message || err));
      } finally {
        updateButton();
      }
    });

    resetBtn.addEventListener('click', () => {
      mp3File = null;
      mp3Buffer = null;
      coverBuffer = null;
      coverMime = null;
      mp3Input.value = '';
      imgInput.value = '';
      mp3Info.style.display = 'none';
      imgInfo.style.display = 'none';
      coverPreview.style.display = 'none';
      coverPreview.src = '';
      coverPlaceholder.style.display = 'flex';
      titleInput.value = '';
      artistInput.value = '';
      albumInput.value = '';
      clearStatus();
      updateButton();
    });
  </script>
</body>
</html>
