<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>問題が発生したため、PCを再起動する必要があります</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    background: #0078d7;
    color: #fff;
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: none;
  }
  .screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    max-width: 900px;
    margin: 0 auto;
  }
  .sad {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 28px;
    font-weight: 300;
  }
  .title {
    font-size: 28px;
    font-weight: 400;
    line-height: 1.4;
    margin-bottom: 18px;
  }
  .desc {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 32px;
    opacity: 0.95;
  }
  .progress {
    font-size: 16px;
    margin-bottom: 40px;
  }
  .qr-area {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .qr {
    width: 112px;
    height: 112px;
    background: #fff;
    flex-shrink: 0;
    padding: 6px;
  }
  .qr canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  .info {
    font-size: 13px;
    line-height: 1.55;
    opacity: 0.9;
  }
  .stopcode {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sad">:(</div>
    <div class="title">問題が発生したため、PCを再起動する必要があります。</div>
    <div class="desc">エラー情報を収集しています。自動的に再起動します。</div>
    <div class="progress"><span id="percent">0</span>% 完了</div>
    <div class="qr-area">
      <div class="qr">
        <canvas id="qrCanvas" width="25" height="25"></canvas>
      </div>
      <div class="info">
        この問題と可能な解決方法の詳細については、<br>
        https://www.windows.com/stopcode を参照してください<br><br>
        サポート担当者に連絡する場合は、この情報を伝えてください:<br>
        <div class="stopcode">
          停止コード: CRITICAL_PROCESS_DIED<br>
          失敗した内容: ntoskrnl.exe
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const size = 25; 
      const canvas = document.getElementById('qrCanvas');
      const ctx = canvas.getContext('2d');
      const modules = Array.from({ length: size }, () => Array(size).fill(false));
      function rand() {
        return Math.random() < 0.48;
      }
      function placeFinder(x, y) {
        for (let dy = 0; dy < 7; dy++) {
          for (let dx = 0; dx < 7; dx++) {
            const isBorder = dx === 0 || dx === 6 || dy === 0 || dy === 6;
            const isCenter = dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4;
            modules[y + dy][x + dx] = isBorder || isCenter;
          }
        }
      }

      function placeTiming() {
        for (let i = 8; i < size - 8; i++) {
          modules[6][i] = i % 2 === 0;
          modules[i][6] = i % 2 === 0;
        }
      }

      function fillRandom() {
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            if ((x < 8 && y < 8) || (x > size - 9 && y < 8) || (x < 8 && y > size - 9)) continue;
            if (x === 6 || y === 6) continue;
            modules[y][x] = rand();
          }
        }
      }

      function clearSeparators() {
        for (let i = 0; i < 8; i++) {
          modules[7][i] = false;
          modules[i][7] = false;
        }
        for (let i = 0; i < 8; i++) {
          modules[7][size - 1 - i] = false;
          modules[i][size - 8] = false;
        }
        for (let i = 0; i < 8; i++) {
          modules[size - 8][i] = false;
          modules[size - 1 - i][7] = false;
        }
      }

      placeFinder(0, 0);
      placeFinder(size - 7, 0);
      placeFinder(0, size - 7);
      placeTiming();
      fillRandom();
      clearSeparators();
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#000';
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (modules[y][x]) {
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }
    })();

    let p = Math.floor(Math.random() * 8) + 2;
    const el = document.getElementById('percent');
    el.textContent = p;

    function tick() {
      if (p < 99) {
        const speed = p < 30 ? 0.7 : (p < 70 ? 0.22 : 0.035);
        p += speed;
        if (p > 99) p = 99;
        el.textContent = Math.floor(p);
      }
      requestAnimationFrame(tick);
    }
    setTimeout(tick, 900);
  </script>
</body>
</html>
