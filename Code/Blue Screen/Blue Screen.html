<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>問題が発生したため、PCを再起動する必要があります</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    background: #0078d7;
    color: #fff;
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: none;
  }
  .screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    max-width: 900px;
    margin: 0 auto;
  }
  .sad {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 28px;
    font-weight: 300;
  }
  .title {
    font-size: 28px;
    font-weight: 400;
    line-height: 1.4;
    margin-bottom: 18px;
  }
  .desc {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 32px;
    opacity: 0.95;
  }
  .progress {
    font-size: 16px;
    margin-bottom: 40px;
  }
  .qr-area {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .qr {
    width: 148px;
    height: 148px;
    background: #fff;
    flex-shrink: 0;
    padding: 16px;
  }
  .qr canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  .info {
    font-size: 13px;
    line-height: 1.55;
    opacity: 0.9;
  }
  .stopcode {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sad">:(</div>
    <div class="title">問題が発生したため、PCを再起動する必要があります。</div>
    <div class="desc">エラー情報を収集しています。自動的に再起動します。</div>
    <div class="progress"><span id="percent">0</span>% 完了</div>
    <div class="qr-area">
      <div class="qr">
        <canvas id="qrCanvas" width="116" height="116"></canvas>
      </div>
      <div class="info">
        この問題と可能な解決方法の詳細については、<br>
        https://www.windows.com/stopcode を参照してください<br><br>
        サポート担当者に連絡する場合は、この情報を伝えてください:<br>
        <div class="stopcode">
          停止コード: CRITICAL_PROCESS_DIED<br>
          失敗した内容: ntoskrnl.exe
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // 実在するQRコード: https://www.windows.com/stopcode
      const QR_DATA = [
        "11111110000111110111101111111",
        "10000010000001111000101000001",
        "10111010110011010001101011101",
        "10111010110000110111001011101",
        "10111010110110011111101011101",
        "10000010110010000100101000001",
        "11111110101010101010101111111",
        "00000000110010101001000000000",
        "10111110001000001100001111100",
        "10101000101111110001101110001",
        "00000011101001111110000000000",
        "11101001000101010001101101010",
        "00000110000000110101000001100",
        "10010001110110011001011010001",
        "01110110100100000000111101100",
        "00001101010010101011000110010",
        "01001011011000000100100101100",
        "11111001000001110111111110101",
        "10011011101101111100101100100",
        "10000100100101011001111110010",
        "10001011100000110100111110111",
        "00000000111010001001100011111",
        "11111110001100010011101011100",
        "10000010111100111011100010010",
        "10111010111110010100111110110",
        "10111010111100101011100101111",
        "10111010101101011111111111110",
        "10000010000000101000100101010",
        "11111110101110000101010111100"
      ];

      const canvas = document.getElementById('qrCanvas');
      const ctx = canvas.getContext('2d');
      const size = QR_DATA.length;
      const SCALE = 4; // 1モジュール = 4px（等倍表示のため整数）

      canvas.width = size * SCALE;
      canvas.height = size * SCALE;

      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000';
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (QR_DATA[y][x] === '1') {
            ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
          }
        }
      }
    })();

    let p = Math.floor(Math.random() * 8) + 2;
    const el = document.getElementById('percent');
    el.textContent = p;

    function tick() {
      if (p < 99) {
        const speed = p < 30 ? 0.7 : (p < 70 ? 0.22 : 0.035);
        p += speed;
        if (p > 99) p = 99;
        el.textContent = Math.floor(p);
      }
      requestAnimationFrame(tick);
    }
    setTimeout(tick, 900);
  </script>
</body>
</html>
