<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sync App</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

/* 共通 */
.screen {
  display: none;
  height: 100vh;
  justify-content: center;
  align-items: center;
}

.active {
  display: flex;
}

/* 接続画面 */
.container {
  background: #1e293b;
  padding: 30px;
  border-radius: 12px;
  width: 320px;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
  cursor: pointer;
}

.create { background: #8b5cf6; }
.connect { background: #3b82f6; }
.accept { background: #22c55e; }

/* 接続後画面 */
.main {
  width: 100%;
  height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.topbar {
  position: absolute;
  top: 10px;
  right: 10px;
}

.add-btn {
  padding: 8px 12px;
  border-radius: 8px;
  background: #f59e0b;
  border: none;
  cursor: pointer;
}

.device-text {
  font-size: 20px;
}
</style>
</head>

<body>

<!-- 接続前 -->
<div id="pairScreen" class="screen active">
  <div class="container">

    <h2>ペア接続</h2>

    <button class="create" onclick="createPair()">コード生成</button>

    <input id="pairId" placeholder="ペアID">

    <button class="connect" onclick="requestPair()">接続</button>
    <button class="accept" onclick="acceptPair()">許可</button>

    <p id="status">未接続</p>

  </div>
</div>

<!-- 接続後 -->
<div id="mainScreen" class="screen">
  <div class="main">

    <div class="topbar">
      <button class="add-btn" onclick="resetApp()">＋ 新しいデバイス</button>
    </div>

    <div id="deviceText" class="device-text">
      接続済み
    </div>

    <button onclick="sendNotification()">通知を送信</button>

  </div>
</div>

<script>
let pairId = "";
let connected = false;
let notified = false;

// 通知許可
async function enableNotification() {
  if (Notification.permission !== "granted") {
    await Notification.requestPermission();
  }
}

// コード生成
async function createPair() {
  const res = await fetch("/api/pair", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ action: "create" })
  });

  const data = await res.json();

  pairId = data.pairId;
  document.getElementById("pairId").value = pairId;
}

// 接続
async function requestPair() {
  pairId = document.getElementById("pairId").value;

  await fetch("/api/pair", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      pairId,
      action: "request"
    })
  });

  document.getElementById("status").textContent = "接続待機中...";
  await enableNotification();

  watchStatus();
}

// 許可
async function acceptPair() {
  pairId = document.getElementById("pairId").value;

  await fetch("/api/pair", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      pairId,
      action: "accept"
    })
  });

  document.getElementById("status").textContent = "許可しました";
}

// 状態監視
function watchStatus() {
  setInterval(async () => {
    if (connected) return;

    const res = await fetch(`/api/pair?pairId=${pairId}`);
    const data = await res.json();

    if (data.accepted && !notified) {
      notified = true;
      connected = true;

      switchToMain();
    }
  }, 2000);
}

// 画面切り替え
function switchToMain() {
  document.getElementById("pairScreen").classList.remove("active");
  document.getElementById("mainScreen").classList.add("active");

  document.getElementById("deviceText").textContent =
    pairId + " のデバイスに通知を送信";

  new Notification("接続成功", {
    body: "デバイスが接続されました"
  });
}

// 通知送信（デモ）
function sendNotification() {
  new Notification("送信しました", {
    body: "相手に通知を送りました"
  });
}

// リセット（新しいデバイス）
function resetApp() {
  location.reload();
}
</script>

</body>
</html>
