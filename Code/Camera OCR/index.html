<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>カメラOCR - テキスト読み取り</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --success: #22c55e;
      --border: #2d3340;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      line-height: 1.5;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    .video-wrap {
      position: relative;
      width: 100%;
      background: #000;
      aspect-ratio: 4/3;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #video.hidden {
      display: none;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
      font-size: 0.95rem;
    }

    .placeholder svg {
      width: 48px;
      height: 48px;
      opacity: 0.5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      justify-content: center;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #2d3340;
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #3a4150;
    }

    .btn-success {
      background: var(--success);
      color: #052e16;
    }

    .btn-success:hover:not(:disabled) {
      background: #16a34a;
    }

    .lang-select {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    select {
      background: #2d3340;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.4em;
      padding: 0 14px 10px;
    }

    .status.working {
      color: #60a5fa;
    }

    .status.error {
      color: #f87171;
    }

    .result-card {
      padding: 16px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .result-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
    }

    #result {
      width: 100%;
      min-height: 120px;
      max-height: 280px;
      background: #12151c;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      white-space: pre-wrap;
      overflow-y: auto;
    }

    .progress-bar {
      height: 4px;
      background: #2d3340;
      border-radius: 2px;
      overflow: hidden;
      margin: 0 14px 10px;
      display: none;
    }

    .progress-bar.active {
      display: block;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s;
    }

    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.25rem;
      }
      button {
        flex: 1 1 40%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="text-align: center;">
      <h1>📷 カメラOCR</h1>
      <p class="subtitle">カメラで撮った文字をテキストに変換します</p>
    </div>

    <div class="card">
      <div class="video-wrap">
        <video id="video" playsinline autoplay muted class="hidden"></video>
        <div id="placeholder" class="placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <span>カメラを起動してください</span>
        </div>
      </div>

      <div class="lang-select">
        <label for="lang">言語：</label>
        <select id="lang">
          <option value="jpn" selected>日本語</option>
          <option value="eng">英語</option>
          <option value="jpn+eng">日本語 + 英語</option>
        </select>
      </div>

      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="status" id="status">準備完了</div>

      <div class="controls">
        <button id="startBtn" class="btn-primary">
          <span>カメラ起動</span>
        </button>
        <button id="captureBtn" class="btn-success" disabled>
          <span>テキスト読み取り</span>
        </button>
        <button id="stopBtn" class="btn-secondary" disabled>
          <span>停止</span>
        </button>
      </div>
    </div>

    <div class="card result-card">
      <div class="result-header">
        <h2>認識結果</h2>
        <button id="copyBtn" class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" disabled>
          コピー
        </button>
      </div>
      <textarea id="result" placeholder="ここに認識したテキストが表示されます…" readonly></textarea>
    </div>

    <p class="footer">
      すべてブラウザ内で処理されます（画像はサーバーに送信されません）<br>
      Tesseract.js を使用
    </p>
  </div>

  <script>
    const video = document.getElementById('video');
    const placeholder = document.getElementById('placeholder');
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const stopBtn = document.getElementById('stopBtn');
    const copyBtn = document.getElementById('copyBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const langSelect = document.getElementById('lang');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    let stream = null;
    let worker = null;
    let isProcessing = false;

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    async function startCamera() {
      try {
        setStatus('カメラを起動中…');
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        video.classList.remove('hidden');
        placeholder.style.display = 'none';
        startBtn.disabled = true;
        captureBtn.disabled = false;
        stopBtn.disabled = false;
        setStatus('カメラ起動中 — 「テキスト読み取り」を押してください');
      } catch (err) {
        console.error(err);
        setStatus('カメラにアクセスできませんでした。許可を確認してください。', 'error');
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      video.classList.add('hidden');
      placeholder.style.display = 'flex';
      startBtn.disabled = false;
      captureBtn.disabled = true;
      stopBtn.disabled = true;
      setStatus('カメラを停止しました');
    }

    async function captureAndOCR() {
      if (!stream || isProcessing) return;
      isProcessing = true;
      captureBtn.disabled = true;
      progressBar.classList.add('active');
      progressFill.style.width = '0%';
      setStatus('画像を処理中…', 'working');

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      const lang = langSelect.value;

      try {
        if (!worker) {
          worker = await Tesseract.createWorker(lang, 1, {
            logger: m => {
              if (m.status === 'recognizing text') {
                const p = Math.round((m.progress || 0) * 100);
                progressFill.style.width = p + '%';
                setStatus(`認識中… ${p}%`, 'working');
              } else if (m.status) {
                setStatus(m.status, 'working');
              }
            }
          });
        } else {
          await worker.loadLanguage(lang);
          await worker.initialize(lang);
        }

        const { data: { text } } = await worker.recognize(canvas);

        resultEl.value = text.trim() || '（テキストを検出できませんでした）';
        copyBtn.disabled = !text.trim();
        setStatus('認識完了');
      } catch (err) {
        console.error(err);
        setStatus('エラーが発生しました: ' + err.message, 'error');
        resultEl.value = '';
      } finally {
        isProcessing = false;
        captureBtn.disabled = false;
        progressBar.classList.remove('active');
        progressFill.style.width = '0%';
      }
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(resultEl.value);
        const original = copyBtn.textContent;
        copyBtn.textContent = 'コピーしました！';
        setTimeout(() => copyBtn.textContent = original, 1500);
      } catch {
        resultEl.select();
        document.execCommand('copy');
      }
    });

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    captureBtn.addEventListener('click', captureAndOCR);

    window.addEventListener('beforeunload', () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (worker) worker.terminate();
    });
  </script>
</body>
</html>
