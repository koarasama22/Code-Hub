<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 ― かさねて、増やせ。</title>
<style>
  :root{
    --bg:#15131a;
    --bg-2:#1c1922;
    --panel:#221f29;
    --panel-2:#2a2632;
    --cell-empty:#332f3c;
    --ink:#f3ede4;
    --dim:#a79ec2;
    --accent:#ffb454;
    --accent-soft:#ffb45433;
    --radius:14px;
    --board-gap:12px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, #2a2140 0%, transparent 45%),
      radial-gradient(circle at 100% 110%, #1a2e33 0%, transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
    overflow-x:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
    min-height:100%;
  }

  .wrap{ width:100%; max-width:440px; }

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:18px;
    gap:12px;
  }

  .title-block h1{
    font-family: Georgia, "Hiragino Mincho ProN", serif;
    font-weight:700;
    font-size:2.4rem;
    letter-spacing:0.02em;
    margin:0;
    line-height:1;
    background:linear-gradient(120deg,#ffe1a8,#ff9d6c 55%,#c77dff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .title-block p{
    margin:6px 0 0;
    font-size:0.82rem;
    color:var(--dim);
    letter-spacing:0.08em;
  }

  .scores{ display:flex; gap:8px; }
  .score-box{
    background:var(--panel);
    border-radius:10px;
    padding:8px 14px;
    text-align:center;
    min-width:64px;
    border:1px solid #ffffff10;
  }
  .score-box .label{
    font-size:0.6rem;
    letter-spacing:0.12em;
    color:var(--dim);
    text-transform:uppercase;
  }
  .score-box .value{
    font-family:"SF Mono", "Courier New", monospace;
    font-size:1.15rem;
    font-weight:700;
    color:var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Controls row ---------- */
  .controls-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .hint{
    font-size:0.78rem;
    color:var(--dim);
    line-height:1.5;
  }
  button#newGame{
    background:var(--panel-2);
    color:var(--ink);
    border:1px solid #ffffff14;
    border-radius:10px;
    padding:10px 16px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  button#newGame:hover{ background:#37324a; }
  button#newGame:active{ transform:scale(0.96); }

  /* ---------- Board ---------- */
  .board-outer{
    position:relative;
    background:var(--panel);
    border-radius:20px;
    padding:var(--board-gap);
    box-shadow:
      0 20px 40px -20px #000000aa,
      inset 0 1px 0 #ffffff08;
  }

  .board{
    position:relative;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:var(--board-gap);
    aspect-ratio:1/1;
  }

  .cell-bg{
    background:var(--cell-empty);
    border-radius:10px;
  }

  .tile{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    font-weight:800;
    font-family: -apple-system,"Hiragino Sans","Segoe UI",system-ui,sans-serif;
    user-select:none;
    transition: left .11s cubic-bezier(.2,.8,.3,1), top .11s cubic-bezier(.2,.8,.3,1), opacity .1s ease;
    will-change: left, top, transform;
  }

  .tile-pop{ animation: pop .18s ease; }
  .tile-merge-pulse{ animation: pulse .22s ease; }

  @keyframes pop{
    0%{ transform:scale(0.4); opacity:0.4; }
    70%{ transform:scale(1.08); }
    100%{ transform:scale(1); opacity:1; }
  }
  @keyframes pulse{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }

  /* ---------- Overlay ---------- */
  .overlay{
    position:absolute;
    inset:0;
    border-radius:20px;
    background:#15131adb;
    backdrop-filter: blur(3px);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding:20px;
    z-index:10;
  }
  .overlay.show{ display:flex; }
  .overlay h2{
    margin:0;
    font-family:Georgia, serif;
    font-size:1.8rem;
    background:linear-gradient(120deg,#ffe1a8,#ff9d6c);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .overlay p{ margin:0; color:var(--dim); font-size:0.9rem; }
  .overlay button{
    background:var(--accent);
    color:#241a0a;
    border:none;
    border-radius:10px;
    padding:10px 22px;
    font-weight:700;
    cursor:pointer;
    font-size:0.9rem;
  }

  footer{
    margin-top:22px;
    color:var(--dim);
    font-size:0.72rem;
    text-align:center;
    line-height:1.6;
  }
  footer b{ color:var(--ink); }

  @media (max-width:380px){
    .title-block h1{ font-size:2rem; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="title-block">
      <h1>2048</h1>
      <p>かさねて、増やせ。</p>
    </div>
    <div class="scores">
      <div class="score-box">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">BEST</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="controls-row">
    <div class="hint">矢印キー / WASD / スワイプで操作<br>同じ数字を重ねて 2048 を目指そう</div>
    <button id="newGame">はじめから</button>
  </div>

  <div class="board-outer">
    <div class="board" id="board">
      <!-- 16 empty cell backgrounds -->
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>

      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">Game Over</h2>
        <p id="overlaySub">これ以上動かせません</p>
        <button id="overlayBtn">もう一度</button>
      </div>
    </div>
  </div>

  <footer>このファイルは完全オフラインで動作します。<br><b>Ctrl/Cmd + S</b> で保存すれば、いつでもどこでも遊べます。</footer>
</div>

<script>
(function(){
  "use strict";

  const SIZE = 4;
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');
  const newGameBtn = document.getElementById('newGame');

  let grid = [];          // grid[r][c] = {value, id} or null
  let score = 0;
  let best = 0;
  let idCounter = 1;
  let won = false;
  let keepPlayingAfterWin = false;
  let tileEls = {};       // id -> DOM element
  let cellSize = 0, gap = 0;

  // ---- persistence (best score only; works offline via localStorage) ----
  function loadBest(){
    try{
      const v = localStorage.getItem('game2048_best');
      return v ? parseInt(v,10) : 0;
    }catch(e){ return 0; }
  }
  function saveBest(v){
    try{ localStorage.setItem('game2048_best', String(v)); }catch(e){ /* ignore, offline file:// may block */ }
  }

  // ---- color system: continuous heat-gradient by log2(value) ----
  function colorForValue(v){
    const lv = Math.log2(v); // 1..17+
    const t = Math.min((lv-1)/10, 1); // 0 at 2, 1 at ~2048
    const hue = 195 - t*230;          // teal(195) -> pink/violet(-35 => 325)
    const hueWrapped = ((hue % 360)+360)%360;
    const sat = 55 + t*25;
    const light = 62 - t*14;
    const glow = 0.15 + t*0.5;
    return {
      bg: `hsl(${hueWrapped} ${sat}% ${light}%)`,
      glow: `hsla(${hueWrapped} ${sat}% ${Math.min(light+15,85)}% / ${glow})`,
      text: lv >= 3 ? '#1c1420' : '#1c1420'
    };
  }

  function measure(){
    const outer = boardEl.getBoundingClientRect();
    gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--board-gap')) || 12;
    cellSize = (outer.width - gap*(SIZE-1)) / SIZE;
  }

  function posFor(r,c){
    return { left: c*(cellSize+gap), top: r*(cellSize+gap) };
  }

  function emptyGrid(){
    const g = [];
    for(let r=0;r<SIZE;r++){ g.push(new Array(SIZE).fill(null)); }
    return g;
  }

  function cloneValues(g){
    return g.map(row => row.map(cell => cell ? cell.value : 0));
  }

  function randomEmptyCell(g){
    const empties = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!g[r][c]) empties.push([r,c]);
    if(empties.length===0) return null;
    return empties[Math.floor(Math.random()*empties.length)];
  }

  function spawnTile(g, forceValue){
    const cell = randomEmptyCell(g);
    if(!cell) return null;
    const [r,c] = cell;
    const value = forceValue || (Math.random() < 0.9 ? 2 : 4);
    const tile = { value, id: idCounter++, r, c, isNew:true };
    g[r][c] = tile;
    return tile;
  }

  function newGame(){
    grid = emptyGrid();
    score = 0;
    won = false;
    keepPlayingAfterWin = false;
    idCounter = 1;
    Object.values(tileEls).forEach(el => el.remove());
    tileEls = {};
    overlay.classList.remove('show');
    measure();
    spawnTile(grid);
    spawnTile(grid);
    updateScore();
    render(true);
  }

  function updateScore(){
    scoreEl.textContent = score;
    if(score > best){
      best = score;
      saveBest(best);
    }
    bestEl.textContent = best;
  }

  // ---- render: create/update DOM tiles to match grid state ----
  function render(instant){
    measure();
    const seen = new Set();
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const t = grid[r][c];
        if(!t) continue;
        seen.add(t.id);
        let el = tileEls[t.id];
        const {left, top} = posFor(r,c);
        const col = colorForValue(t.value);
        const fontSize = t.value >= 1000 ? cellSize*0.32 : t.value >= 100 ? cellSize*0.38 : cellSize*0.44;

        if(!el){
          el = document.createElement('div');
          el.className = 'tile tile-pop';
          el.style.width = cellSize+'px';
          el.style.height = cellSize+'px';
          boardEl.appendChild(el);
          tileEls[t.id] = el;
          if(instant){ el.style.transition='none'; }
        }
        el.style.left = left+'px';
        el.style.top = top+'px';
        el.style.width = cellSize+'px';
        el.style.height = cellSize+'px';
        el.style.background = col.bg;
        el.style.color = col.text;
        el.style.fontSize = fontSize+'px';
        el.style.boxShadow = `0 6px 14px -6px #00000066, 0 0 22px ${col.glow}`;
        el.textContent = t.value;

        if(t.justMerged){
          el.classList.remove('tile-merge-pulse');
          void el.offsetWidth;
          el.classList.add('tile-merge-pulse');
          t.justMerged = false;
        }
        if(instant){
          requestAnimationFrame(()=>{ el.style.transition=''; });
        }
      }
    }
    // remove tiles no longer present
    Object.keys(tileEls).forEach(id=>{
      if(!seen.has(Number(id))){
        tileEls[id].remove();
        delete tileEls[id];
      }
    });
  }

  // ---- core move logic ----
  // returns {moved, gainedScore, reached2048}
  function move(dir){
    // dir: 'left','right','up','down'
    let moved = false;
    let gained = 0;
    let reached2048 = false;

    const traverseOrder = [];
    for(let i=0;i<SIZE;i++) traverseOrder.push(i);
    const reverse = (dir==='right' || dir==='down');
    const order = reverse ? [...traverseOrder].reverse() : traverseOrder;

    function lineCoords(lineIndex){
      const coords = [];
      for(const i of order){
        if(dir==='left' || dir==='right') coords.push([lineIndex, i]);
        else coords.push([i, lineIndex]);
      }
      return coords;
    }

    for(let li=0; li<SIZE; li++){
      const coords = lineCoords(li);
      const tiles = coords.map(([r,c]) => grid[r][c]).filter(Boolean);
      const merged = [];
      const resultTiles = [];

      for(let i=0;i<tiles.length;i++){
        const cur = tiles[i];
        if(resultTiles.length && !merged[resultTiles.length-1] &&
           resultTiles[resultTiles.length-1].value === cur.value){
          resultTiles[resultTiles.length-1] = {
            value: cur.value*2,
            id: resultTiles[resultTiles.length-1].id,
            justMerged: true
          };
          merged[resultTiles.length-1] = true;
          gained += cur.value*2;
          if(cur.value*2 === 2048) reached2048 = true;
          // old id (cur.id) tile disappears -> handled by seen-set removal
        } else {
          resultTiles.push({ value:cur.value, id:cur.id, justMerged:false });
          merged.push(false);
        }
      }

      for(let i=0;i<coords.length;i++){
        const [r,c] = coords[i];
        const newTile = resultTiles[i] || null;
        const oldTile = grid[r][c];
        if(newTile){
          if(!oldTile || oldTile.id !== newTile.id || oldTile.value !== newTile.value){
            moved = true;
          }
          grid[r][c] = { value:newTile.value, id:newTile.id, r, c, justMerged:newTile.justMerged };
        } else {
          if(oldTile) moved = true;
          grid[r][c] = null;
        }
      }
    }

    return { moved, gained, reached2048 };
  }

  function canMoveAnywhere(g){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(!g[r][c]) return true;
        const v = g[r][c].value;
        if(c<SIZE-1 && g[r][c+1] && g[r][c+1].value===v) return true;
        if(r<SIZE-1 && g[r+1][c] && g[r+1][c].value===v) return true;
      }
    }
    return false;
  }

  function handleMove(dir){
    if(overlay.classList.contains('show') && !keepPlayingAfterWin) return;
    const result = move(dir);
    if(!result.moved) return;

    score += result.gained;
    updateScore();
    spawnTile(grid);
    render(false);

    if(result.reached2048 && !won){
      won = true;
      setTimeout(()=>{
        overlayTitle.textContent = '2048達成！';
        overlaySub.textContent = 'おめでとうございます。続けて遊べます。';
        overlayBtn.textContent = '続ける';
        overlay.classList.add('show');
      }, 180);
      return;
    }

    if(!canMoveAnywhere(grid)){
      setTimeout(()=>{
        overlayTitle.textContent = 'ゲームオーバー';
        overlaySub.textContent = `スコア ${score} ／ これ以上動かせません`;
        overlayBtn.textContent = 'もう一度';
        overlay.classList.add('show');
      }, 180);
    }
  }

  overlayBtn.addEventListener('click', ()=>{
    if(won && overlayBtn.textContent === '続ける'){
      keepPlayingAfterWin = true;
      overlay.classList.remove('show');
    } else {
      newGame();
    }
  });
  newGameBtn.addEventListener('click', newGame);

  // ---- keyboard ----
  const keyMap = {
    ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
    a:'left', d:'right', w:'up', s:'down',
    A:'left', D:'right', W:'up', S:'down'
  };
  window.addEventListener('keydown', (e)=>{
    const dir = keyMap[e.key];
    if(dir){
      e.preventDefault();
      handleMove(dir);
    }
  });

  // ---- touch / swipe ----
  let touchStartX=0, touchStartY=0, touching=false;
  boardEl.addEventListener('touchstart', (e)=>{
    if(e.touches.length!==1) return;
    touching = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});

  boardEl.addEventListener('touchend', (e)=>{
    if(!touching) return;
    touching = false;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    const threshold = 24;
    if(Math.max(absX,absY) < threshold) return;
    if(absX > absY){
      handleMove(dx>0 ? 'right' : 'left');
    } else {
      handleMove(dy>0 ? 'down' : 'up');
    }
  }, {passive:true});

  // prevent page scroll while swiping on board
  boardEl.addEventListener('touchmove', (e)=>{ e.preventDefault(); }, {passive:false});

  window.addEventListener('resize', ()=> render(true));

  // ---- init ----
  best = loadBest();
  bestEl.textContent = best;
  newGame();
})();
</script>
</body>
</html>
