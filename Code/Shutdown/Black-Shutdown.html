<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シャットダウンしています...</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo UI", sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: none;
  }
  .container {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 28px;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .text {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.03em;
  }
  .sub {
    font-size: 13px;
    color: #aaa;
    margin-top: -12px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="text">シャットダウンしています</div>
    <div class="sub">しばらくお待ちください...</div>
  </div>
</body>
</html>
