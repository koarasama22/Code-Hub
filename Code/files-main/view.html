<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画面を見る</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; text-align: center; }
  input { padding: 12px; font-size: 18px; width: 260px; border-radius: 8px; border: 1px solid #ccc; }
  button { padding: 12px 24px; font-size: 16px; border-radius: 8px; border: none; background: #111; color: #fff; cursor: pointer; margin-left: 8px; }
  #status { color: #555; margin-top: 12px; }
  video { width: 100%; margin-top: 16px; border-radius: 8px; background: #000; }
</style>
</head>
<body>
  <h1>画面を見る</h1>
  <p>共有する側の端末に表示されているIDを入力してください。</p>
  <div>
    <input id="hostId" placeholder="相手のID" />
    <button id="connectBtn">接続</button>
  </div>
  <p id="status"></p>
  <video id="remoteVideo" autoplay playsinline></video>

  <script>
    const hostIdInput = document.getElementById('hostId');
    const connectBtn = document.getElementById('connectBtn');
    const statusEl = document.getElementById('status');
    const remoteVideo = document.getElementById('remoteVideo');

    const peer = new Peer();

    peer.on('open', () => {
      statusEl.textContent = '準備完了。相手のIDを入力して接続してください。';
    });

    peer.on('error', (err) => {
      statusEl.textContent = 'エラー: ' + err.type;
      console.error(err);
    });

    connectBtn.addEventListener('click', () => {
      const hostId = hostIdInput.value.trim();
      if (!hostId) return;

      statusEl.textContent = '接続中…';
      // 受信専用なので空のストリームを渡して発信する
      const emptyStream = new MediaStream();
      const call = peer.call(hostId, emptyStream);

      call.on('stream', (remoteStream) => {
        remoteVideo.srcObject = remoteStream;
        statusEl.textContent = '接続されました。';
      });

      call.on('close', () => {
        statusEl.textContent = '接続が終了しました。';
      });

      call.on('error', (e) => {
        statusEl.textContent = '接続エラー';
        console.error(e);
      });
    });
  </script>
</body>
</html>
