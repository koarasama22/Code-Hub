<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: "SF Mono", "Cascadia Code", "Consolas", "Menlo", monospace;
      color: #e0e0e0;
      overflow: hidden;
    }

    .container {
      text-align: center;
      max-width: 720px;
      width: 92%;
      padding: 1.5rem;
    }

    .spinner {
      position: relative;
      width: 56px;
      height: 56px;
      margin: 0 auto 1.15rem;
    }

    .spinner-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
    }

    .spinner-ring.outer {
      border-top-color: #4fc3f7;
      border-right-color: rgba(79, 195, 247, 0.35);
      animation: spin 0.9s cubic-bezier(0.5, 0.15, 0.5, 0.85) infinite;
      filter: drop-shadow(0 0 6px rgba(79, 195, 247, 0.5));
    }

    .spinner-ring.mid {
      inset: 7px;
      border-bottom-color: #81d4fa;
      border-left-color: rgba(129, 212, 250, 0.4);
      animation: spin-rev 0.65s cubic-bezier(0.4, 0.1, 0.6, 0.9) infinite;
      filter: drop-shadow(0 0 4px rgba(129, 212, 250, 0.4));
    }

    .spinner-ring.inner {
      inset: 16px;
      border-top-color: #29b6f6;
      border-right-color: transparent;
      animation: spin 0.45s linear infinite;
      filter: drop-shadow(0 0 3px rgba(41, 182, 246, 0.6));
    }

    .spinner-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4fc3f7;
      top: 50%;
      left: 50%;
      margin: -3.5px 0 0 -3.5px;
      box-shadow: 0 0 10px #4fc3f7, 0 0 18px rgba(79, 195, 247, 0.5);
      animation: pulse-dot 1.1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
      to { transform: rotate(-360deg); }
    }

    @keyframes pulse-dot {
      0%, 100% {
        transform: scale(0.75);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.25);
        opacity: 1;
      }
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #b0bec5;
      margin-bottom: 0.55rem;
      animation: loadingPulse 1.8s ease-in-out infinite;
      text-shadow: 0 0 12px rgba(79, 195, 247, 0.25);
    }

    @keyframes loadingPulse {
      0%, 100% {
        opacity: 0.75;
        transform: scale(1);
        text-shadow: 0 0 8px rgba(79, 195, 247, 0.15);
      }
      50% {
        opacity: 1;
        transform: scale(1.03);
        text-shadow: 0 0 18px rgba(79, 195, 247, 0.45);
      }
    }

    .status {
      font-size: 0.88rem;
      color: #90a4ae;
      margin-bottom: 1.2rem;
      min-height: 1.3em;
    }

    .path {
      font-size: 0.78rem;
      color: #4fc3f7;
      background: rgba(79, 195, 247, 0.06);
      border: 1px solid rgba(79, 195, 247, 0.15);
      border-radius: 6px;
      padding: 0.55rem 0.9rem;
      margin-bottom: 1.2rem;
      text-align: left;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      letter-spacing: 0.02em;
    }

    .path .label {
      color: #78909c;
      margin-right: 0.4em;
    }

    .progress-wrap {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.45rem;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #29b6f6, #4fc3f7, #81d4fa);
      border-radius: 3px;
      transition: width 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 0 0 10px rgba(79, 195, 247, 0.4);
    }

    .percent {
      font-size: 0.75rem;
      color: #78909c;
      letter-spacing: 0.05em;
      margin-bottom: 1.4rem;
    }
    .log-panel {
      text-align: left;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      height: 180px;
      overflow: hidden;
      position: relative;
    }

    .log-panel::before {
      content: "LOG";
      position: absolute;
      top: 0.45rem;
      right: 0.7rem;
      font-size: 0.65rem;
      color: #546e7a;
      letter-spacing: 0.08em;
    }

    .log-inner {
      height: 100%;
      overflow: hidden;
      font-size: 0.72rem;
      line-height: 1.45;
      color: #78909c;
    }

    .log-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-line .ts {
      color: #546e7a;
      margin-right: 0.5em;
    }

    .log-line .ok {
      color: #66bb6a;
    }

    .log-line .dl {
      color: #4fc3f7;
    }

    .hint {
      margin-top: 1.6rem;
      font-size: 0.7rem;
      color: #546e7a;
      letter-spacing: 0.03em;
    }

    .bg-glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 195, 247, 0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="container">
    <div class="spinner">
      <div class="spinner-ring outer"></div>
      <div class="spinner-ring mid"></div>
      <div class="spinner-ring inner"></div>
      <div class="spinner-dot"></div>
    </div>
    <h1 id="loop-text">Loading...</h1>
    <p class="status" id="status">ファイルを準備しています</p>

    <div class="path">
      <span class="label">PATH</span>
      <span id="path">Grok¥Home¥</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div class="percent" id="percent">0.0%</div>

    <div class="log-panel">
      <div class="log-inner" id="log"></div>
    </div>

    <p class="hint">この処理には時間がかかることがあります。しばらくお待ちください。</p>
  </div>

  <script>
    const titles = [
            "L",
            "Lo",
            "Loa",
            "Load",
            "Loadi",
            "Loadin",
            "Loading",
            "Loading.",
            "Loading..",
            "Loading...",
        ];
        let index = 0;

        setInterval(() => {
            document.title = titles[index];
            index = (index + 1) % titles.length;
        }, 100);

    // also cycle the visible Loading text a bit more naturally
    const loadingEl = document.getElementById("loop-text");
    const loadingFrames = [
      "Loading",
      "Loading.",
      "Loading..",
      "Loading..."
    ];
    let loadingFrame = 0;
    setInterval(() => {
      loadingEl.textContent = loadingFrames[loadingFrame];
      loadingFrame = (loadingFrame + 1) % loadingFrames.length;
    }, 420);

    const segments = [
      "Grok","Home","download","cache","temp","assets","resources","data",
      "modules","packages","lib","src","bin","user","system","local",
      "appdata","roaming","config","logs","session","buffer","stream",
      "chunk","payload","metadata","index","manifest","bundle","archive",
      "extract","verify","checksum","hash","signature","certificate",
      "keychain","token","auth","runtime","engine","core","kernel",
      "driver","service","daemon","worker","thread","queue","pipeline",
      "node_modules","vendor","dist","build","out","release","debug",
      "shared","common","utils","helpers","types","models","schemas"
    ];

    const statuses = [
      "ファイルを準備しています",
      "サーバーに接続しています",
      "データを取得しています",
      "チャンクをダウンロード中",
      "整合性を確認しています",
      "バッファに書き込んでいます",
      "メタデータを解析中",
      "依存関係を解決しています",
      "キャッシュを更新中",
      "署名を検証しています",
      "展開処理を実行中",
      "リソースをマッピング中",
      "セッションを同期しています",
      "最終チェックを実行中"
    ];

    const logActions = [
      "GET",
      "FETCH",
      "WRITE",
      "VERIFY",
      "HASH",
      "STREAM",
      "BUFFER",
      "CACHE",
      "EXTRACT",
      "MAP"
    ];

    const pathEl = document.getElementById("path");
    const statusEl = document.getElementById("status");
    const barEl = document.getElementById("bar");
    const percentEl = document.getElementById("percent");
    const logEl = document.getElementById("log");
    let pathParts = ["Grok", "Home"];
    let progress = 0;
    let statusIndex = 0;
    let logLines = [];
    const MAX_LOG = 12;
    // burst mode: sometimes progress jumps fast
    let burstUntil = 0;

    function pad(n) {
      return n.toString().padStart(2, "0");
    }
    function nowTs() {
      const d = new Date();
      return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + "." +
             Math.floor(d.getMilliseconds() / 10).toString().padStart(2, "0");
    }
    function tickPath() {
      const next = segments[Math.floor(Math.random() * segments.length)];
      pathParts.push(next);
      if (pathParts.length > 16) {
        pathParts = pathParts.slice(-12);
      }
      pathEl.textContent = pathParts.join("¥") + "¥";
    }

    function addLog() {
      const action = logActions[Math.floor(Math.random() * logActions.length)];
      const pathStr = pathParts.join("¥") + "¥";
      const size = (Math.random() * 480 + 12).toFixed(1);
      const line =
        '<div class="log-line">' +
        '<span class="ts">' + nowTs() + '</span>' +
        '<span class="ok">[' + action + ']</span> ' +
        '<span class="dl">' + pathStr + '</span> ' +
        size + 'KB' +
        '</div>';

      logLines.push(line);
      if (logLines.length > MAX_LOG) logLines.shift();
      logEl.innerHTML = logLines.join("");
    }

    function tickProgress() {
      const now = Date.now();
      // randomly enter a fast burst (only while still under ~50%)
      if (progress < 48 && now > burstUntil && Math.random() < 0.18) {
        // burst lasts 0.6–2.2 seconds of rapid ticks
        burstUntil = now + 600 + Math.random() * 1600;
      }

      let step = 0;
      const inBurst = now < burstUntil && progress < 48;

      if (inBurst) {
        // really fast when bursting
        if (progress < 20) {
          step = 0.8 + Math.random() * 2.2;
        } else if (progress < 35) {
          step = 0.35 + Math.random() * 1.1;
        } else {
          step = 0.12 + Math.random() * 0.45;
        }
      } else {
        // normal / sluggish phases with more variance
        if (progress < 10) {
          step = Math.random() < 0.7 ? (0.05 + Math.random() * 0.25) : 0;
        } else if (progress < 25) {
          step = Math.random() < 0.55 ? (0.02 + Math.random() * 0.12) : 0;
        } else if (progress < 40) {
          // often stalls
          step = Math.random() < 0.28 ? (0.008 + Math.random() * 0.04) : 0;
        } else if (progress < 55) {
          // past the old 47.3 wall: slow but steady crawl
          step = Math.random() < 0.45 ? (0.004 + Math.random() * 0.018) : 0;
        } else if (progress < 80) {
          // even slower
          step = Math.random() < 0.3 ? (0.0015 + Math.random() * 0.008) : 0;
        } else if (progress < 95) {
          step = Math.random() < 0.2 ? (0.0006 + Math.random() * 0.003) : 0;
        } else {
          // asymptotic creep toward 99.9
          step = Math.random() < 0.12 ? (0.00015 + Math.random() * 0.0008) : 0;
        }
      }

      progress = Math.min(progress + step, 99.9);
      barEl.style.width = progress.toFixed(2) + "%";
      percentEl.textContent = progress.toFixed(1) + "%";
    }

    function tickStatus() {
      statusIndex = (statusIndex + 1) % statuses.length;
      statusEl.textContent = statuses[statusIndex];
    }

    setInterval(tickPath, 40);
    setInterval(addLog, 80);
    // faster base tick so bursts feel snappy
    setInterval(tickProgress, 180);
    setInterval(tickStatus, 2200);
    tickPath();
    addLog();
    tickProgress();
  </script>
</body>
</html>
