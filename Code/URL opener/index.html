<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>URLオープナー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h1>URL オープナー</h1>

    <input id="url" type="text" placeholder="https://example.com">

    <button class="btn inpage" onclick="openInPage()">WEB内で開く</button>
    <button class="btn newtab" onclick="openNewTab()">新しいタブで開く</button>
    <button class="btn darkmode" onclick="toggleDark()">ダークモード切替</button>

    <iframe id="viewer"></iframe>
  </div>

  <script src="main.js"></script>
</body>
</html>
