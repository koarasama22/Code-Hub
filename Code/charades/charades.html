<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジェスチャーゲーム</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:radial-gradient(circle at 20% 0%, #3a1550 0%, transparent 45%),
               radial-gradient(circle at 100% 100%, #0d2b3d 0%, transparent 40%), #0f0c18;
    color:#f5f0ff;
    font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:30px 16px 60px;
  }
  a.back{ align-self:flex-start; color:#a89fc4; text-decoration:none; font-size:0.85rem; margin-bottom:10px;}
  h1{
    font-size:2.1rem; margin:0 0 4px;
    background:linear-gradient(120deg,#ff9d6c,#c77dff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.sub{ color:#a89fc4; margin:0 0 22px; font-size:0.88rem; text-align:center; max-width:480px;}

  .cat-select{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:22px;
  }
  .cat-btn{
    background:#1c1729; border:1px solid #ffffff1c; color:#cfc3ea;
    padding:9px 16px; border-radius:20px; font-size:0.85rem; cursor:pointer;
  }
  .cat-btn.active{ background:linear-gradient(120deg,#ff9d6c,#c77dff); color:#1a1220; font-weight:700; border-color:transparent;}

  .stage{
    width:100%; max-width:600px;
    background:#1c1729; border:1px solid #ffffff14; border-radius:24px;
    padding:44px 30px; text-align:center; min-height:260px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    position:relative;
  }
  #word{
    font-size:2.4rem; font-weight:900; line-height:1.3;
    color:#ffd166;
    filter:blur(14px);
    transition:filter .2s ease;
    user-select:none;
  }
  #word.shown{ filter:blur(0); }
  #catLabel{ color:#7a6f96; font-size:0.85rem; letter-spacing:0.08em; }
  #timerDisplay{
    font-size:3rem; font-weight:900; color:#ff5c8a;
    display:none;
  }
  .hint{ color:#7a6f96; font-size:0.85rem; }

  .btn-row{ display:flex; gap:14px; margin-top:26px; flex-wrap:wrap; justify-content:center; }
  button{
    font-size:1rem; font-weight:700; border:none; border-radius:14px;
    padding:15px 28px; cursor:pointer; transition:transform .12s ease;
  }
  button:active{ transform:scale(0.95); }
  #newWordBtn{ background:#2a2438; color:#e6dcff; }
  #startTimerBtn{ background:linear-gradient(120deg,#ff9d6c,#c77dff); color:#1a1220; }
  footer{ margin-top:26px; color:#7a6f96; font-size:0.75rem; text-align:center; max-width:520px; line-height:1.7;}
</style>
</head>
<body>
  <a class="back" href="index.html">← ゲーム一覧</a>
  <h1>🎭 ジェスチャーゲーム</h1>
  <p class="sub">出題者だけがお題を見て、声を出さずに体で表現。他のみんなが当てよう！</p>

  <div class="cat-select" id="catSelect">
    <button class="cat-btn active" data-cat="動物">動物</button>
    <button class="cat-btn" data-cat="職業">職業</button>
    <button class="cat-btn" data-cat="スポーツ">スポーツ</button>
    <button class="cat-btn" data-cat="日常動作">日常動作</button>
    <button class="cat-btn" data-cat="全部">全部ミックス</button>
  </div>

  <div class="stage">
    <div id="catLabel">出題者だけ画面を見てね</div>
    <div id="word" class="shown">タップしてお題を表示</div>
    <div id="timerDisplay"></div>
    <div class="hint" id="hintText">お題が見えたら画面を伏せて、ジェスチャーで表現しよう</div>
  </div>

  <div class="btn-row">
    <button id="newWordBtn">お題を見る/変える</button>
    <button id="startTimerBtn">60秒タイマー開始</button>
  </div>

  <footer>制限時間内にチームが当てられたら成功。当てられなかったら次の出題者にバトンタッチしよう。</footer>

<script>
(function(){
  const words = {
    "動物": ["ゾウ","カンガルー","ペンギン","ゴリラ","ヘビ","カメ","コウモリ","タコ","カニ","ウサギ","キリン","サル","クジャク","ラクダ","カエル"],
    "職業": ["消防士","医者","美容師","パティシエ","警察官","先生","漁師","料理人","運転手","歌手","画家","農家","カメラマン","パイロット","大工"],
    "スポーツ": ["野球","サッカー","水泳","卓球","ボクシング","バスケットボール","テニス","ゴルフ","スキー","柔道","バレーボール","スケート","ボウリング","綱引き","縄跳び"],
    "日常動作": ["歯みがき","洗濯物を干す","電話をかける","料理をする","掃除機をかける","傘をさす","自転車に乗る","靴ひもを結ぶ","写真を撮る","本を読む","寝る","くしゃみをする","荷物を運ぶ","お辞儀をする","釣りをする"]
  };

  const wordEl = document.getElementById('word');
  const catLabel = document.getElementById('catLabel');
  const hintText = document.getElementById('hintText');
  const newWordBtn = document.getElementById('newWordBtn');
  const startTimerBtn = document.getElementById('startTimerBtn');
  const timerDisplay = document.getElementById('timerDisplay');
  const catSelect = document.getElementById('catSelect');

  let currentCat = '動物';
  let currentWord = '';
  let revealed = false;
  let timerInterval = null;

  function pickWord(){
    let pool;
    if(currentCat === '全部'){
      pool = Object.values(words).flat();
    } else {
      pool = words[currentCat];
    }
    currentWord = pool[Math.floor(Math.random()*pool.length)];
  }

  function showWord(){
    pickWord();
    revealed = true;
    wordEl.textContent = currentWord;
    wordEl.classList.add('shown');
    catLabel.textContent = `カテゴリ: ${currentCat}`;
    hintText.textContent = 'お題が見えたら画面を伏せて、ジェスチャーで表現しよう';
  }

  newWordBtn.addEventListener('click', showWord);

  catSelect.addEventListener('click', (e)=>{
    const btn = e.target.closest('.cat-btn');
    if(!btn) return;
    [...catSelect.children].forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
  });

  startTimerBtn.addEventListener('click', ()=>{
    if(timerInterval) clearInterval(timerInterval);
    wordEl.classList.remove('shown');
    wordEl.textContent = '制限時間中！';
    timerDisplay.style.display = 'block';
    let t = 60;
    timerDisplay.textContent = t;
    timerDisplay.style.color = '#ff5c8a';
    timerInterval = setInterval(()=>{
      t--;
      timerDisplay.textContent = t;
      if(t <= 10) timerDisplay.style.color = '#ffd166';
      if(t <= 0){
        clearInterval(timerInterval);
        timerDisplay.textContent = 'タイムアップ！';
      }
    }, 1000);
  });

  showWord();
})();
</script>
</body>
</html>
